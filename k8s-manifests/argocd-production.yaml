apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: famloom-dataprep-production
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
labels:
  app.kubernetes.io/name: famloom-dataprep-production
  app.kubernetes.io/part-of: famloom-ecosystem
spec:
  project: default
  source:
    repoURL: https://github.com/miladmyled/famloom-dataprep.git
    targetRevision: main
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
