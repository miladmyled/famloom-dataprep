apiVersion: batch/v1
kind: CronJob
metadata:
  name: famloom-scraper
  labels:
    app: famloom-scraper
    tier: producer-worker
spec:
  # Twice a day, 05:00 and 16:00 Vancouver time (timeZone is GA since Kubernetes 1.27; cluster is v1.35)
  schedule: "0 5,16 * * *"
  timeZone: "America/Vancouver"
  # Prevents overlapping executions if a scrape takes longer (e.g. rate-limit backoffs)
  concurrencyPolicy: Forbid
  # Skip a run that could not start within 15 minutes of its slot; the next slot retries
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Hard cap per run (90 min); a city that does not finish is retried at the next run
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: famloom-scraper
        spec:
          containers:
          - name: scraper-container
            image: ghcr.io/miladmyled/famloom-dataprep:sha-e9b9fb4
            imagePullPolicy: IfNotPresent
            command: ["python", "main.py"]
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "utf-8"
            # Classifier chain and decision rules (keys come from dataprep-secrets)
            - name: CLASSIFIER_PROVIDER
              value: "jev"
            - name: CLASSIFIER_FALLBACK
              value: "gemini"
            - name: TYPESAFE_MODEL
              value: "jev-1.13.0"
            - name: REVIEW_POLICY
              value: "drop"
            # Decision thresholds approved at GATE 1a (2026-09-27)
            - name: FAMILY_ACCEPT_THRESHOLD
              value: "0.50"
            - name: FAMILY_REVIEW_THRESHOLD
              value: "0.40"
            - name: TAG_THRESHOLD
              value: "0.70"
            - name: LANGUAGE_THRESHOLD
              value: "0.60"
            - name: SINGLES_REJECT_THRESHOLD
              value: "0.60"
            # Injects Kafka and Azure PostgreSQL credentials, TYPESAFE_API_KEY, GEMINI_API_KEY, GEMINI_MODEL
            envFrom:
            - secretRef:
                name: dataprep-secrets
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "1000m"
                memory: "2048Mi"
          restartPolicy: OnFailure
