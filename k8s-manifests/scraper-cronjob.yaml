apiVersion: batch/v1
kind: CronJob
metadata:
  name: famloom-scraper
  labels:
    app: famloom-scraper
    tier: producer-worker
spec:
  # Execute exactly every 5 minutes
  schedule: "*/5 * * * *"
  # Prevents overlapping executions if a scrape takes longer (e.g. rate-limit backoffs)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: famloom-scraper
        spec:
          containers:
          - name: scraper-container
            image: ghcr.io/miladmyled/famloom-dataprep:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "main.py"]
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "utf-8"
            # Injects Kafka and Azure PostgreSQL credentials
            envFrom:
            - secretRef:
                name: dataprep-secrets
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "1000m"
                memory: "1536Mi"
          restartPolicy: OnFailure
