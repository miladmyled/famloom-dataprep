apiVersion: apps/v1
kind: Deployment
metadata:
  name: famloom-event-consumer
  labels:
    app: famloom-event-consumer
    tier: consumer-worker
spec:
  replicas: 1
  # Recreate strategy ensures old pod cleanly leaves group before new pod starts,
  # preventing consumer group rebalance deadlocks on single-partition topics.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: famloom-event-consumer
  template:
    metadata:
      labels:
        app: famloom-event-consumer
    spec:
      # Allows the Kafka consumer to cleanly commit in-flight offsets, leave group, and close DB pools
      terminationGracePeriodSeconds: 30
      containers:
      - name: consumer-container
        image: famloom-dataprep:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "consumer_main.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONIOENCODING
          value: "utf-8"
        # Set to "true" if you need the consumer pod to automatically rewind to partition 0 offset 0 on startup
        - name: KAFKA_RESET_OFFSET_ON_START
          value: "false"
        # Injects Kafka and Azure PostgreSQL credentials
        envFrom:
        - secretRef:
            name: dataprep-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      restartPolicy: Always
