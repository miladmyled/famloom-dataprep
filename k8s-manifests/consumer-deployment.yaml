apiVersion: apps/v1
kind: Deployment
metadata:
  name: famloom-event-consumer
  labels:
    app: famloom-event-consumer
    tier: background-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: famloom-event-consumer
  template:
    metadata:
      labels:
        app: famloom-event-consumer
    spec:
      # Grace period allowing in-flight messages to commit and Kafka consumer group rebalance cleanly
      terminationGracePeriodSeconds: 30
      containers:
      - name: consumer-container
        image: famloom-dataprep:local
        imagePullPolicy: Never
        command: ["python", "consumer_main.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONIOENCODING
          value: "utf-8"
        # Injects Azure PostgreSQL & Kafka credentials from Kubernetes secret
        envFrom:
        - secretRef:
            name: dataprep-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      restartPolicy: Always
