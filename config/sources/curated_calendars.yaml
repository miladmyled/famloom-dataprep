# Curated event calendars read on every run (decision 9: accredited sources only).
# A page is used only when `enabled: true`. Every entry records when robots.txt and the site's
# written terms were checked and what they say. Pages whose robots.txt or terms forbid
# automated access stay in this file with enabled: false and the reason, so nobody re-adds them.
#
# kind:   ical | rss | jsonld | html      (html = main text -> Jev screen -> Gemini extraction)
# render: static | js                      (js = needs a headless browser; only where allowed)
# All checks below were done 2026-09-27 with User-Agent "FamLoomBot/1.0 (+mailto:miladmyled@gmail.com)".
# GATE 2a (2026-09-27): the user approved every entry marked `approved`. Disabled entries also act
# as a block list: web discovery never uses a site listed here with enabled: false.

