# Public Instagram professional (Business/Creator) accounts read through Meta's Business
# Discovery API (Phase 3, INSTAGRAM_ENABLED=false until Meta App Review passes).
# Only accounts approved by a person are listed. Personal accounts cannot be read and are never
# scraped. From each account only recent post captions are used; no images, no person names.
#
# Fields: city (as in family_profiles.location), username (without @), display_name,
#         why (what makes it a family event source), enabled
#
# Example (disabled; replace with real approved accounts):
- city: Vancouver, BC, Canada
  username: example_family_hikes
  display_name: Example Family Hiking Club
  why: "Example only - weekly family hikes with dates in captions"
  enabled: false
