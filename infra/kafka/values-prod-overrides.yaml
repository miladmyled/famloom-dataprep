# Production overrides for the Kafka Helm release "famloom-broker" (namespace "kafka",
# chart bitnami/kafka 32.4.3, app 4.0.0). Apply on EVERY helm upgrade of that release, on top of
# the existing values (see README.md in this folder).
#
# Why: with the chart defaults (768Mi limit, heap = 75% of RAM) the broker was OOMKilled on every
# start while recovering raw-events-ingestion (3.4M offsets) and crash-looped for 19 days
# (1,908 restarts), so no City Events reached production. Fixed 2026-10-06 with a 2Gi limit and a
# fixed 1Gi heap; this file keeps that fix through future upgrades.

broker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # Fixed heap well below the limit; the rest is for metaspace, page cache and direct buffers.
  heapOpts: "-Xms1g -Xmx1g"
