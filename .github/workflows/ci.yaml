name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality Gate: Run Unit & Integration Tests
  # ============================================================================
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tests with Pytest
        run: |
          pytest -v

  # ============================================================================
  # 2. Build & GitOps Hand-off: Build Docker Image, Push to GHCR & Update K8s
  # ============================================================================
  build-and-deploy:
    name: Build Image & Trigger GitOps
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Short Git Commit SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.sha_short }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes Manifests with New Image Tag
        run: |
          NEW_IMAGE="ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}"
          echo "Updating Kubernetes manifests to use: ${NEW_IMAGE}"
          
          sed -i -E "s|image: .*famloom-dataprep:.*|image: ${NEW_IMAGE}|g" \
            k8s-manifests/consumer-deployment.yaml \
            k8s-manifests/scraper-cronjob.yaml \
            k8s-manifests/janitor-cronjob.yaml

      - name: Commit and Push Updated Manifests (Trigger ArgoCD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/
          
          if git diff --staged --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "chore(k8s): deploy image sha-${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin main
          fi
